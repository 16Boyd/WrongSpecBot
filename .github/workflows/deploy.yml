name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # Detect which files changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      discord: ${{ steps.filter.outputs.discord }}
      cloudflare: ${{ steps.filter.outputs.cloudflare }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            discord:
              - 'src/commands/**'
              - 'src/deploy-commands.ts'
            cloudflare:
              - 'cloudflare-cron/**'

  deploy-discord-commands:
    name: Deploy Discord Commands
    needs: changes
    if: needs.changes.outputs.discord == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build
        run: pnpm run build
        
      - name: Deploy Discord Commands
        run: pnpm run deploy:discord:only
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}

  deploy-cloudflare:
    name: Deploy Cloudflare Worker
    needs: changes
    if: needs.changes.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        working-directory: ./cloudflare-cron
        run: pnpm install
        
      - name: Deploy to Cloudflare
        working-directory: ./cloudflare-cron
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
